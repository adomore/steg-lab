name: ci

on:
  push:
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The commands checker validates documented flags by running each script
      # with --help. Without the runtime dependencies every gate dies on import,
      # the checker reads an empty help text, and it reports 12 flags as
      # missing -- including ones that plainly exist. A validator that fails
      # for environmental reasons is F-54 again, in this repo's own CI.
      - name: install python stack
        run: pip install -r requirements.txt
      - name: six documentation checkers
        run: python3 scripts/check-docs.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # check-crossval.py exits non-zero when a cross-validation would be
      # silently skipped, and tests/test_getting_started.py requires it to
      # succeed. That makes it a gate, so this job carries every tool it probes
      # -- pngcheck, djpeg, tshark, ffmpeg, mkfs.vfat, mcopy -- rather than
      # only the three the gates shell out to. e2fsprogs and ntfs-3g are here
      # for lab 23: they are not probed, but without them the ext4 and NTFS
      # cross-validations skip while the suite still reports green (F-52).
      # tshark's postinst asks a debconf question about non-root capture, so
      # the frontend has to be noninteractive or the install blocks.
      #
      # timeout-minutes is a hang detector, not a performance budget, and it is
      # set from the measured spread rather than from one sample. This step has
      # taken 48s, 5m19s and 15m09s across successful runs -- ffmpeg and tshark
      # pull a lot -- while the observed hangs ran 25 and 58 minutes. A first
      # attempt at 10 minutes was picked from a single fast observation and
      # failed a run whose install was merely slow. Leave headroom: a false
      # failure here trains people to re-run without reading, which costs more
      # than catching a hang ten minutes later.
      # exiftool is not probed by check-crossval either, but
      # tests/test_tool_practice.py gates on it: that file publishes the tool
      # behaviours the docs assert (F-66), and a skipped assertion about a
      # tool is how the docs go stale without the build noticing.
      - name: install reference tools
        timeout-minutes: 25
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pngcheck libjpeg-progs steghide
          sudo apt-get install -y -qq tshark ffmpeg dosfstools mtools e2fsprogs ntfs-3g
          sudo apt-get install -y -qq libimage-exiftool-perl
      - name: install python stack
        run: pip install -r requirements.txt
      - name: no cross-validation is silently skipped
        run: python3 scripts/check-crossval.py
      # generate.py compares against the committed manifest rather than
      # rewriting it, so this pair is no longer self-referential. The git check
      # is belt and braces: it catches a future change that puts the rewrite
      # back, or a --update-manifest that slipped into the run.
      - name: corpus is reproducible
        run: |
          python3 corpus/generate.py
          python3 corpus/generate.py --verify
          git diff --exit-code corpus/manifest.json
      - name: pytest
        run: python3 -m pytest tests -q

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Same treatment as the test job. This step hung twice for tens of
      # minutes on 2026-08-19 while the test job's larger install, which
      # differed only by the frontend setting, completed in the same run. It
      # had passed here on four earlier runs, so a runner image roll most
      # likely introduced a package that now prompts. timeout-minutes turns a
      # hang into a failure that reports, rather than one that occupies a
      # runner until the six-hour ceiling. This job's install measures 9s to
      # 1m38s when healthy, so 25 minutes is pure headroom; it shares the test
      # job's value so there is one number to reason about.
      - name: install reference tools
        timeout-minutes: 25
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pngcheck libjpeg-progs steghide
      - name: install python stack
        run: pip install -r requirements.txt
      # Gates are the acceptance criteria for the theory chapters. If a gate
      # goes red the chapter is making a claim the repository cannot support,
      # so this job blocks rather than warns.
      - name: gate G0 (warden model)
        run: python3 gates/g0_wardens.py
      - name: gate G1 (structural parsing)
        run: python3 gates/g1_parsers.py
      - name: gate G2 (classical embedding)
        run: python3 gates/g2_classical.py
      # G4 includes a criterion that must FAIL to detect: LSB matching has to
      # stay within 0.15 of chance for every shipped detector.
      - name: gate G3 (adaptive embedding)
        run: python3 gates/g3_adaptive.py --n 12
      - name: gate G4 (statistical detection)
        run: python3 gates/g4_statistical.py --n 60
      - name: gate G5 (feature sets and ensembles)
        run: python3 gates/g5_feature_sets.py --n 200
      - name: gate G6 (deep learning)
        run: python3 gates/g6_deep_learning.py --n 120 --epochs 12
      - name: gate G7 (blind capstone)
        run: python3 gates/g7_capstone.py --trials 24
      - name: JPEG entropy encoder verification
        run: python3 scripts/verify-jpeg-encoder.py --n 8
      - name: upload gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-results
          path: gates/results/

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install python stack
        run: pip install -r requirements.txt
      - name: unit tests
        run: cd rust/stegscan && cargo test --offline -q
      - name: format check
        run: cd rust/stegscan && cargo fmt --check
      # The port is only worth having if it agrees with the reference
      # implementation on every file, including the malformed ones.
      - name: differential test vs python
        run: python3 scripts/difftest.py --n 200
